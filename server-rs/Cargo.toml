[package]
name = "qingniao-sync"
version = "0.1.1"
edition = "2021"
license-file = "../LICENSE"
description = "Bluebird SMS Minimalist End-to-End Encrypted Synchronization Service: Storing Only Encrypted Envelopes"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
strip = true
opt-level = "s"
