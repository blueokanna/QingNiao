name: qingniao
description: "Local-first Android SMS and MMS with a Rust core and Material 3 Expressive interface."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rust_lib_qingniao:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  material_new_shapes: 1.0.0
  intl: ^0.20.3
  characters: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  analyzer: ^14.7.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/l10n/
    - assets/palettes/
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Variable.ttf
    - family: HarmonyOSSans
      fonts:
        - asset: assets/fonts/HarmonyOS_SansSC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_SansSC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_SansSC_Bold.ttf
          weight: 700
