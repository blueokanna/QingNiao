include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .toolchains/**
    - build/**
    - rust_builder/cargokit/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    use_null_aware_elements: false
    prefer_initializing_formals: false
    prefer_const_constructors_in_immutables: false
