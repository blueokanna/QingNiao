name: Android delivery

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag for a draft GitHub Release; leave empty for validation only
        required: false
        type: string
      production:
        description: Build with the production signing key
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: 3.47.9
      FLUTTER_REVISION: c197ca5199e9ee5661e865596c9c07294dfab51c
      DART_VERSION: 3.13.7
      CARGOKIT_RUST_TOOLCHAIN: 1.99.1
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: flutter/flutter
          ref: ${{ env.FLUTTER_REVISION }}
          fetch-depth: 0
          path: .toolchains/flutter
          persist-credentials: false
      - name: Initialize Android SDK and install pinned packages
        shell: bash
        run: bash tool/setup_android_sdk.sh
      - name: Install pinned Rust toolchain and expose Flutter
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/.toolchains/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$GITHUB_WORKSPACE/.toolchains/flutter" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Verify Flutter SDK identity
        shell: bash
        run: |
          python3 tool/check_flutter_sdk.py --sdk-root "$FLUTTER_ROOT" --version "$FLUTTER_VERSION" --revision "$FLUTTER_REVISION"
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          mkdir -p build/verification
          flutter --version --machine > build/verification/ci-flutter-version.json
          python3 tool/check_flutter_sdk.py --sdk-root "$FLUTTER_ROOT" --version "$FLUTTER_VERSION" --revision "$FLUTTER_REVISION" --metadata build/verification/ci-flutter-version.json --dart-version "$DART_VERSION"
      - name: Validate source
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/check_localization.dart
          python3 tool/generate_android_strings.py --check
          python3 tool/check_sms_contract.py
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          flutter analyze
          flutter test
          cargo test --locked --manifest-path rust/Cargo.toml
          cargo test --locked --manifest-path server-rs/Cargo.toml
      - name: Prepare production key
        if: ${{ inputs.production == true }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qingniao-release.jks"
      - name: Build and inspect APK
        shell: bash
        env:
          PRODUCTION: ${{ inputs.production || false }}
          QINGNIAO_KEYSTORE_PATH: ${{ runner.temp }}/qingniao-release.jks
          QINGNIAO_STORE_PASSWORD: ${{ inputs.production && secrets.ANDROID_STORE_PASSWORD || '' }}
          QINGNIAO_KEY_ALIAS: ${{ inputs.production && secrets.ANDROID_KEY_ALIAS || '' }}
          QINGNIAO_KEY_PASSWORD: ${{ inputs.production && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ "$PRODUCTION" == 'true' ]]; then mode=release; else mode=debug; fi
          flutter build apk --"$mode"
          python3 tool/verify_android_pages.py "build/app/outputs/flutter-apk/app-$mode.apk" --report build/native-pages.json
          (cd android && chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug --no-daemon)
          mkdir -p build/delivery
          cp build/native-pages.json build/delivery/native-pages.json
          cp "build/app/outputs/flutter-apk/app-$mode.apk" "build/delivery/qingniao-$mode.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "build/delivery/qingniao-$mode.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "build/delivery/qingniao-$mode.apk" > build/delivery/signature.txt
          git rev-parse HEAD > build/delivery/source-commit.txt
          flutter --version --machine > build/delivery/flutter-version.json
          rustc --version > build/delivery/rust-version.txt
          (cd build/delivery && sha256sum *.apk > SHA256SUMS)
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/qingniao-release.jks"
      - name: Preserve validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qingniao-validation-reports
          path: |
            build/app/reports/
            build/app/test-results/
            build/reports/
            build/native-pages.json
            build/verification/ci-flutter-version.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qingniao-android
          path: build/delivery/
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Create draft release from verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRODUCTION: ${{ inputs.production }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]
          gh run download "$RUN_ID" --name qingniao-android --dir delivery
          flags=(--draft --verify-tag)
          if [[ "$PRODUCTION" != 'true' ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" delivery/* "${flags[@]}" --title "青鸟短信 $RELEASE_TAG" --notes 'Android APK, source commit, toolchain versions, certificate fingerprint and SHA-256 checksums are attached. See the device compatibility matrix before deployment.'
